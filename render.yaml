services:
  - type: web
    name: felmex-global-logistics-website
    runtime: static
    buildCommand: "npm ci && npm run build"
    staticPublishPath: ./dist
    envVars:
      - key: NODE_VERSION
        value: "22.22.1"
      - key: SKIP_INSTALL_DEPS
        value: "true"
    headers:
      - path: "/assets/*"
        name: Cache-Control
        value: "public, max-age=31536000, immutable"
      - path: "/*"
        name: X-Content-Type-Options
        value: nosniff
      - path: "/*"
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: "/*"
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'; upgrade-insecure-requests"
      - path: "/*"
        name: X-Frame-Options
        value: DENY
      - path: "/*"
        name: Permissions-Policy
        value: "camera=(), geolocation=(), microphone=()"
    routes:
      - type: rewrite
        source: "/*"
        destination: "/index.html"
